<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 标签大全 · 前端标签速查手册</title>
<style>
  :root{
    --bg:#f5f6fa;
    --card:#ffffff;
    --text:#222838;
    --muted:#6b7280;
    --accent:#4f46e5;
    --accent-dark:#4338ca;
    --accent-soft:#eef0ff;
    --border:#e6e8f0;
    --code-bg:#1f2530;
    --code-text:#dfe4ee;
    --badge:#16a34a;
    --badge-bg:#e9f9ef;
    --warn-bg:#fff7ed;
    --warn-border:#fed7aa;
    --warn-text:#c2410c;
    --sidebar-w:248px;
    --header-h:64px;
    --radius:12px;
    --shadow:0 1px 3px rgba(30,40,60,.06),0 4px 14px rgba(30,40,60,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}

  /* ========== 顶部栏 ========== */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:60;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:0 20px;
  }
  .menu-btn{
    display:none;width:40px;height:40px;border:1px solid var(--border);background:#fff;border-radius:10px;
    cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;
  }
  .menu-btn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2}
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none;color:var(--text)}
  .brand-logo{
    width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#4338ca);
    color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .brand-title{font-size:17px;font-weight:700;white-space:nowrap}
  .brand-title small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.5px}
  .search-wrap{flex:1;display:flex;justify-content:center;min-width:0}
  .search-box{
    position:relative;width:100%;max-width:460px;
  }
  .search-box svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none;
  }
  #searchInput{
    width:100%;height:40px;border:1px solid var(--border);border-radius:10px;
    padding:0 14px 0 40px;font-size:14.5px;background:#f8f9fc;color:var(--text);outline:none;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  #searchInput:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border:none;background:#e5e7f0;border-radius:50%;cursor:pointer;
    color:#555;font-size:13px;line-height:1;display:none;align-items:center;justify-content:center;
  }
  .search-clear.show{display:flex}

  /* ========== 布局 ========== */
  .sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);z-index:50;
    background:#fff;border-right:1px solid var(--border);
    overflow-y:auto;padding:18px 12px 30px;
  }
  .sidebar h3{
    font-size:12px;color:var(--muted);letter-spacing:1.5px;padding:0 12px 10px;font-weight:600;
  }
  .nav-list{list-style:none}
  .nav-list a{
    display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 0;
    border-radius:9px;text-decoration:none;color:#3d4357;font-size:14px;
    transition:background .15s,color .15s;cursor:pointer;
  }
  .nav-list a:hover{background:var(--accent-soft);color:var(--accent-dark)}
  .nav-list a.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(79,70,229,.28)}
  .nav-dot{width:8px;height:8px;border-radius:50%;background:#c7cbe0;flex-shrink:0}
  .nav-list a.active .nav-dot{background:#fff}
  .nav-count{margin-left:auto;font-size:11px;color:#9aa0b5;background:#f0f1f7;border-radius:20px;padding:1px 8px}
  .nav-list a.active .nav-count{background:rgba(255,255,255,.25);color:#fff}
  .nav-top{margin-top:14px;border-top:1px dashed var(--border);padding-top:12px}

  .main{
    margin-left:var(--sidebar-w);
    padding:calc(var(--header-h) + 24px) 28px 60px;
    max-width:1180px;
  }
  .page-head{margin-bottom:26px}
  .page-head h1{font-size:26px;font-weight:800;letter-spacing:.5px}
  .page-head p{color:var(--muted);margin-top:8px;font-size:14.5px}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .stat-chip{
    background:#fff;border:1px solid var(--border);border-radius:20px;padding:5px 14px;
    font-size:13px;color:#444;box-shadow:var(--shadow);
  }
  .stat-chip b{color:var(--accent)}
  .search-tip{
    display:none;margin-bottom:18px;background:var(--accent-soft);color:var(--accent-dark);
    border:1px solid #d6dbff;border-radius:10px;padding:10px 16px;font-size:14px;
  }
  .search-tip.empty{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}

  /* ========== 分类区块 ========== */
  .category{margin-bottom:40px;scroll-margin-top:calc(var(--header-h) + 16px)}
  .cat-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .cat-bar{width:5px;height:26px;border-radius:3px;background:linear-gradient(180deg,#6366f1,#4338ca)}
  .cat-head h2{font-size:20px;font-weight:700}
  .cat-head .cat-en{font-size:12.5px;color:var(--muted);font-weight:400;letter-spacing:.5px}
  .cat-head .cat-num{
    margin-left:auto;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--border);
    border-radius:20px;padding:3px 12px;
  }
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

  /* ========== 标签卡片 ========== */
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px 14px;box-shadow:var(--shadow);
    transition:transform .18s,box-shadow .18s;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(30,40,80,.12)}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .tag-chip{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:700;
    color:var(--accent-dark);background:var(--accent-soft);
    border:1px solid #dfe3ff;border-radius:7px;padding:2px 9px;
  }
  .badge{
    font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;letter-spacing:.5px;
  }
  .badge.hot{color:var(--badge);background:var(--badge-bg)}
  .badge.dep{color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-border)}
  .card .desc{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
  .card .detail{font-size:13.5px;color:#4b5263;margin-bottom:10px}
  .attrs{list-style:none;margin-bottom:10px}
  .attrs li{font-size:12.5px;color:var(--muted);padding:2px 0;display:flex;gap:7px;align-items:baseline}
  .attrs code{
    color:#b45309;background:#fff7ed;border-radius:5px;padding:0 6px;font-size:12px;flex-shrink:0;
  }
  .example-label{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.5px}
  .code-block{
    background:var(--code-bg);color:var(--code-text);border-radius:9px;
    padding:11px 14px;font-size:12.8px;line-height:1.6;overflow-x:auto;
    white-space:pre;margin-top:auto;
  }
  .code-block .hl{color:#a5b4fc}

  /* ========== 回到顶部 / 遮罩 ========== */
  .back-top{
    position:fixed;right:22px;bottom:26px;width:44px;height:44px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;cursor:pointer;z-index:55;
    box-shadow:0 6px 18px rgba(79,70,229,.4);
    display:none;align-items:center;justify-content:center;
    transition:transform .2s,opacity .2s;
  }
  .back-top.show{display:flex}
  .back-top:hover{transform:translateY(-3px)}
  .back-top svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4}
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(20,24,40,.45);z-index:45;
  }
  .overlay.show{display:block}

  footer{
    margin-left:var(--sidebar-w);padding:26px 28px 40px;color:var(--muted);font-size:13px;
    border-top:1px solid var(--border);text-align:center;background:#fff;
  }

  /* ========== 移动端适配 ========== */
  @media (max-width:920px){
    .menu-btn{display:flex}
    .sidebar{
      transform:translateX(-100%);transition:transform .28s ease;
      box-shadow:4px 0 24px rgba(20,24,40,.15);width:270px;
    }
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0;padding:calc(var(--header-h) + 18px) 16px 50px}
    footer{margin-left:0}
    .brand-title small{display:none}
    .page-head h1{font-size:21px}
    .cards{grid-template-columns:1fr}
    .cat-head h2{font-size:17px}
  }
  @media (max-width:420px){
    .topbar{padding:0 12px;gap:10px}
    .brand-title{font-size:15px}
    .main{padding-left:12px;padding-right:12px}
  }
</style>
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="打开分类菜单">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#top">
    <span class="brand-logo">&lt;/&gt;</span>
    <span class="brand-title">HTML 标签大全<small>HTML TAGS REFERENCE</small></span>
  </a>
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
      <input type="search" id="searchInput" placeholder="搜索标签，如：div、表单、表格、图片…" autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="清空搜索">✕</button>
    </div>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<!-- 左侧分类选项卡 -->
<aside class="sidebar" id="sidebar">
  <h3>标签分类</h3>
  <ul class="nav-list" id="navList"></ul>
  <div class="nav-top">
    <ul class="nav-list">
      <li><a id="backTopLink"><span class="nav-dot"></span>回到顶部</a></li>
    </ul>
  </div>
</aside>

<!-- 主内容 -->
<main class="main" id="top">
  <div class="page-head">
    <h1>HTML 标签速查手册</h1>
    <p>覆盖 HTML 标准全部标签及常见废弃标签，按类别分组、常用标签优先；点击左侧分类可快速跳转，也可直接搜索标签名称或用途。</p>
    <div class="stat-row">
      <span class="stat-chip">共收录 <b id="tagTotal">0</b> 个标签</span>
      <span class="stat-chip"><b id="catTotal">0</b> 大分类</span>
      <span class="stat-chip">绿色标记 = <b style="color:var(--badge)">高频常用</b></span>
    </div>
  </div>
  <div class="search-tip" id="searchTip"></div>
  <div id="content"></div>
</main>

<button class="back-top" id="backTop" aria-label="回到顶部">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<footer>
  HTML 标签大全 · 单文件离线手册 · 兼容桌面端与移动端
</footer>

<script>
/* =====================================================
 * 数据：分类（按常用程度排序）

/* =====================================================

{t:'html',c:1,cat:'basic',d:'HTML 文档根元素',x:'所有 HTML 元素的根节点，包裹整个页面。lang 属性用于声明页面语言，有利于搜索引擎与屏幕阅读器。',a:[['lang','页面语言，如 zh-CN、en'],['dir','文本方向 ltr/rtl']],e:'<html lang="zh-CN">\n  <head>...</head>\n  <body>...</body>\n</html>',k:'根元素 root 语言 lang'},
{t:'head',c:1,cat:'basic',d:'文档头部容器',x:'包含页面的元信息，如标题、字符集、样式表、脚本等，其中的内容不会直接显示在页面上。',a:[],e:'<head>\n  <meta charset="UTF-8">\n  <title>页面标题</title>\n</head>',k:'头部 header 元信息'},
{t:'body',c:1,cat:'basic',d:'文档主体',x:'包含网页中所有可见内容，如文字、图片、链接、表格、按钮等。一个页面只能有一个 body。',a:[],e:'<body>\n  <h1>欢迎</h1>\n  <p>这里是页面内容。</p>\n</body>',k:'主体 可见内容'},

{t:'base',c:0,cat:'basic',d:'基础 URL 与默认目标',x:'为页面中所有相对 URL 指定基础地址，并可设置链接默认打开方式。一个页面最多只能有一个 base，必须放在 head 中。',a:[['href','基础地址'],['target','默认打开方式，如 _blank']],e:'<head>\n  <base href="https://example.com/" target="_blank">\n</head>',k:'base 基础路径 根地址 默认 target'},

{t:'span',c:1,cat:'layout',d:'通用行内容器',x:'无语义的行内元素，用于包裹一小段文字或内容，配合 CSS 设置局部样式，不会换行。',a:[['class','类名'],['style','行内样式']],e:'<p>价格：<span style="color:red">￥99</span></p>',k:'span 行内 文本 局部样式'},

{t:'section',c:1,cat:'layout',d:'主题区段',x:'表示文档中一个独立的主题区段，通常带有标题，用于对内容进行分块，如章节、标签页内容等。',a:[],e:'<section>\n  <h2>第一章</h2>\n  <p>章节内容...</p>\n</section>',k:'section 区块 章节 分区 语义化'},
{t:'article',c:1,cat:'layout',d:'独立内容块',x:'表示可独立分发或复用的完整内容，如一篇文章、一条帖子、一条评论，即使脱离上下文也有意义。',a:[],e:'<article>\n  <h2>文章标题</h2>\n  <p>正文内容...</p>\n</article>',k:'article 文章 帖子 独立内容 语义化'},
{t:'aside',c:1,cat:'layout',d:'侧边 / 附属内容',x:'表示与主内容相关但可独立的部分，如侧边栏、广告、相关推荐、引用说明等。',a:[],e:'<aside>\n  <h3>相关推荐</h3>\n  <ul>...</ul>\n</aside>',k:'aside 侧边栏 侧栏 广告 语义化'},

{t:'figure',c:0,cat:'layout',d:'独立流内容单元',x:'用于包裹独立引用的内容，如图片、图表、代码片段等，通常与 figcaption 配合，内容位置可移动而不影响正文。',a:[],e:'<figure>\n  <img src="chart.png" alt="销量图表">\n  <figcaption>图 1：年度销量</figcaption>\n</figure>',k:'figure 图文 插图 图表 语义化'},
{t:'figcaption',c:0,cat:'layout',d:'figure 的标题说明',x:'为 figure 元素定义标题或说明文字，必须放在 figure 内部，可以是第一个或最后一个子元素。',a:[],e:'<figure>\n  <img src="photo.jpg" alt="照片">\n  <figcaption>这是图片说明</figcaption>\n</figure>',k:'figcaption 图注 图片说明 caption'},
{t:'details',c:0,cat:'layout',d:'可折叠详情区',x:'创建一个可以展开和收起的区域，用户点击 summary 即可切换，常用于 FAQ、折叠面板，无需 JavaScript。',a:[['open','默认是否展开']],e:'<details>\n  <summary>点击查看详情</summary>\n  <p>这里是隐藏的详细内容。</p>\n</details>',k:'details 折叠 展开 手风琴 faq 详情'},
{t:'summary',c:0,cat:'layout',d:'details 的可见标题',x:'为 details 定义可见的摘要标题，点击它可以展开或收起 details 内容。',a:[],e:'<details>\n  <summary>常见问题</summary>\n  <p>答案内容...</p>\n</details>',k:'summary 摘要 折叠标题'},
{t:'dialog',c:0,cat:'layout',d:'对话框 / 模态框',x:'表示一个对话框或模态窗口，可通过 JavaScript 的 showModal() / show() 方法打开，自带遮罩与焦点管理。',a:[['open','是否显示对话框']],e:'<dialog id="dlg">\n  <p>确定要删除吗？</p>\n  <button onclick="dlg.close()">关闭</button>\n</dialog>',k:'dialog 弹窗 模态框 对话框 modal'},
{t:'search',c:0,cat:'layout',d:'搜索区域容器',x:'HTML 2023 年新增的语义容器，用于包裹站点或应用中的搜索、筛选功能（通常是包含搜索框的表单），便于浏览器和屏幕阅读器识别"这是搜索区域"。它没有默认样式和行为，需配合 CSS 使用。',a:[],e:'<search>\n  <form action="/search">\n    <input type="search" name="q" placeholder="搜索内容…">\n    <button type="submit">搜索</button>\n  </form>\n</search>',k:'search 搜索 筛选 查找 新标签 2023'},

/* =====================================================
 * 渲染
 * ===================================================== */
(function(){
  'use strict';

  var navList = document.getElementById('navList');
  var content = document.getElementById('content');
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var searchTip = document.getElementById('searchTip');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');
  var menuBtn = document.getElementById('menuBtn');
  var backTop = document.getElementById('backTop');
  var backTopLink = document.getElementById('backTopLink');

  /* 统计每个分类的标签数 */
  var catCount = {};
  TAGS.forEach(function(tag){
    catCount[tag.cat] = (catCount[tag.cat] || 0) + 1;
  });
  document.getElementById('tagTotal').textContent = TAGS.length;
  document.getElementById('catTotal').textContent = CATEGORIES.length;

  function el(tag, cls, text){
    var node = document.createElement(tag);
    if(cls) node.className = cls;
    if(text != null) node.textContent = text;
    return node;
  }

  /* 渲染左侧导航 */
  CATEGORIES.forEach(function(cat){
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.setAttribute('data-target', cat.id);
    a.innerHTML = '<span class="nav-dot"></span><span class="nav-name"></span><span class="nav-count"></span>';
    a.querySelector('.nav-name').textContent = cat.name;
    a.querySelector('.nav-count').textContent = catCount[cat.id] || 0;
    a.addEventListener('click', function(e){
      e.preventDefault();
      var target = document.getElementById('cat-' + cat.id);
      if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
      closeSidebar();
    });
    li.appendChild(a);
    navList.appendChild(li);
  });

  /* 渲染分类区块与卡片 */
  var allCards = [];
  CATEGORIES.forEach(function(cat){
    var section = el('section', 'category');
    section.id = 'cat-' + cat.id;

    var head = el('div', 'cat-head');
    var bar = el('div', 'cat-bar');
    var h2 = el('h2');
    h2.textContent = cat.name;
    var en = el('span', 'cat-en');
    en.textContent = cat.en;
    var num = el('span', 'cat-num');
    num.textContent = (catCount[cat.id] || 0) + ' 个标签';
    head.appendChild(bar);
    head.appendChild(h2);
    head.appendChild(en);
    head.appendChild(num);
    section.appendChild(head);

    var grid = el('div', 'cards');

    TAGS.filter(function(t){ return t.cat === cat.id; }).forEach(function(tag){
      var card = el('article', 'card');
      card.setAttribute('data-name', (tag.search || tag.t).toLowerCase());
      card.setAttribute('data-haystack',
        (tag.t + ' ' + tag.d + ' ' + tag.x + ' ' + (tag.k || '') + ' ' +
         (tag.a || []).map(function(p){ return p[0]; }).join(' ')).toLowerCase()
      );

      var top = el('div', 'card-top');
      top.appendChild(el('span', 'tag-chip', '<' + tag.t + '>'));
      if(tag.c) top.appendChild(el('span', 'badge hot', '常用'));
      if(cat.id === 'obsolete') top.appendChild(el('span', 'badge dep', '已废弃'));
      card.appendChild(top);

      card.appendChild(el('div', 'desc', tag.d));
      card.appendChild(el('div', 'detail', tag.x));

      if(tag.a && tag.a.length){
        var ul = el('ul', 'attrs');
        tag.a.forEach(function(pair){
          var li = document.createElement('li');
          var code = el('code', null, pair[0]);
          li.appendChild(code);
          li.appendChild(document.createTextNode('— ' + pair[1]));
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }

      card.appendChild(el('div', 'example-label', '代码示例'));
      var pre = el('pre', 'code-block');
      pre.textContent = tag.e;
      card.appendChild(pre);

      grid.appendChild(card);
      allCards.push({ card: card, section: section });
    });

    section.appendChild(grid);
    content.appendChild(section);
  });

  /* ========== 搜索过滤 ========== */
  function doSearch(){
    var q = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle('show', q.length > 0);

    var matchCount = 0;
    var sectionCount = {};

    allCards.forEach(function(item){
      var match = !q || item.card.getAttribute('data-haystack').indexOf(q) !== -1;
      item.card.style.display = match ? '' : 'none';
      if(match){
        matchCount++;
        sectionCount[item.section.id] = true;
      }
    });

    CATEGORIES.forEach(function(cat){
      var sec = document.getElementById('cat-' + cat.id);
      if(sec) sec.style.display = (!q || sectionCount[sec.id]) ? '' : 'none';
    });

    if(q){
      searchTip.style.display = 'block';
      if(matchCount > 0){
        searchTip.classList.remove('empty');
        searchTip.textContent = '搜索 “' + searchInput.value.trim() + '” 共找到 ' + matchCount + ' 个相关标签';
      }else{
        searchTip.classList.add('empty');
        searchTip.textContent = '没有找到与 “' + searchInput.value.trim() + '” 相关的标签，换个关键词试试（如：表单、图片、表格、链接）';
      }
    }else{
      searchTip.style.display = 'none';
    }
  }
  searchInput.addEventListener('input', doSearch);
  searchClear.addEventListener('click', function(){
    searchInput.value = '';
    doSearch();
    searchInput.focus();
  });

  /* ========== 移动端抽屉 ========== */
  function openSidebar(){
    sidebar.classList.add('open');
    overlay.classList.add('show');
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }
  menuBtn.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  /* ========== 回到顶部 ========== */
  function scrollTop(){
    window.scrollTo({ top:0, behavior:'smooth' });
  }
  backTop.addEventListener('click', scrollTop);
  backTopLink.addEventListener('click', function(e){
    e.preventDefault();
    scrollTop();
    closeSidebar();
  });
  window.addEventListener('scroll', function(){
    backTop.classList.toggle('show', window.pageYOffset > 400);
  }, { passive:true });

  /* ========== 滚动监听：高亮当前分类 ========== */
  var navLinks = navList.querySelectorAll('a');
  function setActive(id){
    navLinks.forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-target') === id);
    });
  }
  if('IntersectionObserver' in window){
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          setActive(entry.target.id.replace('cat-', ''));
        }
      });
    }, { rootMargin:'-90px 0px -65% 0px', threshold:0 });
    CATEGORIES.forEach(function(cat){
      var sec = document.getElementById('cat-' + cat.id);
      if(sec) observer.observe(sec);
    });
  }

})();
</script>
