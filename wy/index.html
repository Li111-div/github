`,"css/main.css":`* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  background: #f4f6fa;
  color: #2c3140;
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}

.hero { text-align: center; }
.logo { width: 56px; height: 56px; }
.hero h1 { margin: 10px 0 6px; font-size: 26px; }
.hero p { margin: 0; color: #6b7280; font-size: 14px; }

.box {
  padding: 22px 34px;
  background: #fff;
  border: 1px solid #e2e6ef;
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(30, 40, 70, .08);
  text-align: center;
}

button {
  padding: 9px 22px;
  font-size: 14px;
  color: #fff;
  background: #2f7cf6;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}
button:hover { background: #1f6ae0; }

.count { margin: 14px 0 0; color: #6b7280; font-size: 14px; }
#out { color: #2f7cf6; font-weight: 700; }
`,"js/app.js":`let count = 0;

const btn = document.getElementById("btn");
const out = document.getElementById("out");

btn.addEventListener("click", function () {
  count++;
  out.textContent = count;
  console.log("点击次数：" + count);
});

console.log("页面已加载");

| 按键 | 功能 |
| --- | --- |
| Ctrl+P | 快速打开文件 |
| Ctrl+Shift+P | 命令面板 |
| Ctrl+G | 跳转行 |
| Ctrl+F | 查找替换 |
| Ctrl+Shift+F | 全项目搜索 |
| Ctrl+/ | 注释 |
| Tab | Emmet 展开 |

  .cm-line{padding:0 10px}

  .overlay{padding:max(12px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));align-items:flex-start}
  .overlay-box{position:relative;width:100%;max-width:100%;border-radius:8px}

  .overlay-close{display:grid;place-items:center;position:absolute;top:5px;right:5px;z-index:2;width:38px;height:38px;border-radius:6px;color:var(--fg-dim);font-size:16px;background:transparent;touch-action:manipulation}

  .ctxmenu{min-width:200px;max-width:calc(100vw - 16px);font-size:14px}
  .ctx-item{height:40px;padding:0 12px}
  .ctx-item .key{display:none}
  .mobile-tabbar{display:flex;flex:0 0 auto;height:calc(52px + env(safe-area-inset-bottom));padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--panel-bg);z-index:80}
  .mtab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;height:52px;font-size:11px;color:var(--fg-faint);touch-action:manipulation}
  .mtab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .mtab.active{color:var(--accent);background:var(--active)}

  @media (max-height:500px){

<body class="m-code">

<div id="mobileBackdrop" class="mobile-backdrop" aria-hidden="true"></div>

<div id="app">

  <!-- ================= 标题栏 / 菜单栏 ================= -->
  <div id="titlebar">
    <button class="mbtn" id="mobileMenuBtn" type="button" title="项目文件" aria-label="打开项目文件" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <div class="brand"><span class="brand-mark">&lt;/&gt;</span><span class="brand-name">WebPad<b>IDE</b></span></div>
    <div id="menubar"></div>
    <div class="title-gap"></div>
    <button class="title-search" id="titleSearch" title="快速打开文件 (Ctrl+P)" aria-label="快速打开文件">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 14 14"/></svg>
      <span>输入文件名</span>
    </button>
    <button class="mbtn" id="mobileMoreBtn" type="button" data-cmd="goto.command" title="更多命令" aria-label="更多命令">
      <svg viewBox="0 0 16 16"><path d="M3 8h.01M8 8h.01M13 8h.01"/></svg>
    </button>
  </div>

  <!-- ================= 工具栏 ================= -->
  <div id="toolbar">
    <button class="tbtn" data-cmd="file.new" title="新建文件 (Ctrl+N)">
      <svg viewBox="0 0 16 16"><path d="M9 1.5H4.5A1.5 1.5 0 0 0 3 3v10A1.5 1.5 0 0 0 4.5 14.5h7A1.5 1.5 0 0 0 13 13V5.5L9 1.5Z"/><path d="M9 1.5v4h4"/></svg>
    </button>
    <button class="tbtn" data-cmd="file.newFolder" title="新建文件夹">
      <svg viewBox="0 0 16 16"><path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.5 2h5.5A1.5 1.5 0 0 1 14.5 6.5v6A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5v-8Z"/></svg>
    </button>
    <button class="tbtn" data-cmd="file.save" title="保存 (Ctrl+S)">
      <svg viewBox="0 0 16 16"><path d="M2.5 2.5h9l3 3v8h-12v-11Z"/><path d="M5 2.5v4h6v-4"/><path d="M5 9.5h6v4H5z"/></svg>
    </button>
    <span class="tsep"></span>
    <button class="tbtn" data-cmd="edit.undo" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 16 16"><path d="M3 7h6.5a3.5 3.5 0 0 1 0 7H6"/><path d="M5.5 4.5 3 7l2.5 2.5"/></svg>
    </button>
    <button class="tbtn" data-cmd="edit.redo" title="重做 (Ctrl+Y)">
      <svg viewBox="0 0 16 16"><path d="M13 7H6.5a3.5 3.5 0 0 0 0 7H10"/><path d="M10.5 4.5 13 7l-2.5 2.5"/></svg>
    </button>
    <span class="tsep"></span>
    <button class="tbtn" data-cmd="find.inFile" title="查找 (Ctrl+F)">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 14 14"/></svg>
    </button>
    <button class="tbtn" data-cmd="find.inProject" title="全项目搜索 (Ctrl+Shift+F)">
      <svg viewBox="0 0 16 16"><path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.5 2h5.5A1.5 1.5 0 0 1 14.5 6.5v6A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5v-8Z"/><circle cx="8" cy="10" r="2.4"/><path d="M9.8 11.8 11.5 13"/></svg>
    </button>
    <span class="title-gap"></span>
    <button class="tbtn run" data-cmd="run.preview" title="运行 (Ctrl+Enter)">
      <svg viewBox="0 0 16 16"><path d="M4.5 2.8v10.4L13 8 4.5 2.8Z"/></svg>
      <span>运行</span>
    </button>
  </div>

  <!-- ================= 主体 ================= -->
  <div id="main">

    <aside id="sidebar" aria-label="项目管理器">
      <div class="side-head">
        <span class="side-title">项目管理器</span>
        <span class="side-gap"></span>
        <button class="mini" data-cmd="file.new" title="新建文件">+</button>
        <button class="mini" data-cmd="file.refresh" title="刷新">⟳</button>
        <button class="mini side-close" id="sidebarClose" type="button" title="关闭项目树" aria-label="关闭项目树">✕</button>
      </div>
      <div id="tree" class="tree" tabindex="0"></div>
      <div class="side-foot">
        <span class="fold-tri">▸</span> 已关闭项目
      </div>
    </aside>

    <div class="splitter" id="splitLeft"></div>

    <section id="center">
      <div id="tabs" class="tabs"></div>
      <div id="editorArea">
        <div id="editor"></div>
        <div id="minimapWrap"><canvas id="minimap"></canvas></div>
        <div id="welcome" class="welcome">
          <div class="welcome-inner">
            <div class="welcome-logo">&lt;/&gt;</div>
            <h1>WebPad IDE</h1>
            <p>仿 HBuilderX 的网页版编辑器</p>
            <div class="welcome-keys">
              <div><kbd>Ctrl</kbd>+<kbd>P</kbd> 快速打开</div>
              <div><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> 命令面板</div>
              <div><kbd>Ctrl</kbd>+<kbd>G</kbd> 跳转行</div>
              <div><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> 全项目搜索</div>
            </div>
            <div class="welcome-mobile-hint">点左上角的菜单按钮打开项目文件<br>用底部按钮切换代码与预览</div>
          </div>
        </div>
      </div>
      <div id="panel" class="panel collapsed">
        <div class="panel-head">
          <button class="ptab active" data-panel="console">控制台</button>
          <button class="ptab" data-panel="problems">问题 <span id="problemCount">0</span></button>
          <button class="ptab" data-panel="search">搜索结果</button>
          <span class="side-gap"></span>
          <button class="mini" id="panelClear" title="清空">✕</button>
          <button class="mini" id="panelClose" title="收起">▾</button>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </div>
    </section>

    <div class="splitter" id="splitRight"></div>

    <section id="previewPane">
      <div class="pane-head">
        <span class="label">预览</span>
        <span class="addr" id="previewAddr">localhost/index.html</span>
        <span class="side-gap"></span>
        <button class="mini" id="openNew" title="在新窗口打开">↗</button>
        <button class="mini" id="refreshPreview" title="刷新预览 (F5)">⟳</button>
        <button class="mini" id="togglePreview" title="收起预览">⇥</button>
      </div>
      <div class="frame-wrap">
        <iframe id="preview" title="预览" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-downloads allow-pointer-lock"></iframe>
      </div>
    </section>

  </div>

  <!-- ================= 状态栏 ================= -->
  <div id="statusbar">
    <span id="stFile">未打开文件</span>
    <span class="st-sep"></span>
    <span id="stPos">行 1，列 1</span>
    <span id="stSel"></span>
    <span class="st-gap"></span>
    <button id="stWrap" class="st-btn" title="切换自动换行 (Alt+Z)">不换行</button>
    <span id="stIndent">空格: 2</span>
    <span id="stEncoding">UTF-8</span>
    <span id="stLang">纯文本</span>
    <span class="st-live"><i></i>语法提示库</span>
  </div>

  <!-- ================= 移动端底部导航 ================= -->
  <nav id="mobileTabbar" class="mobile-tabbar" aria-label="移动端导航">
    <button type="button" class="mtab" data-mtab="files" aria-label="项目文件">
      <svg viewBox="0 0 16 16"><path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.5 2h5.5A1.5 1.5 0 0 1 14.5 6.5v6A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5v-8Z"/></svg>
      <span>文件</span>
    </button>
    <button type="button" class="mtab active" data-mtab="code" aria-label="代码编辑">
      <svg viewBox="0 0 16 16"><path d="M5.5 4 2 8l3.5 4"/><path d="M10.5 4 14 8l-3.5 4"/></svg>
      <span>代码</span>
    </button>
    <button type="button" class="mtab" data-mtab="preview" aria-label="预览">
      <svg viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.8"/></svg>
      <span>预览</span>
    </button>
  </nav>

</div>

<!-- 浮层：命令面板 / 输入框 -->
<div id="overlay" class="overlay" hidden>
  <div class="overlay-box">
    <input id="overlayInput" type="text" spellcheck="false" autocomplete="off">
    <div id="overlayList" class="overlay-list"></div>
  </div>
</div>

<!-- 右键菜单 -->
<div id="ctxmenu" class="ctxmenu" hidden></div>

<!-- 轻提示 -->
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script>
(function () {
  var mq = window.matchMedia("(max-width: 620px), (max-width: 1100px) and (max-height: 500px)");
  var body = document.body;
  var sidebar = document.getElementById("sidebar");
  var tree = document.getElementById("tree");
  var backdrop = document.getElementById("mobileBackdrop");
  var menuBtn = document.getElementById("mobileMenuBtn");
  var closeBtn = document.getElementById("sidebarClose");
  var tabbar = document.getElementById("mobileTabbar");
  var lastLongPress = 0;

  // 长按菜单刚弹出时，屏蔽触摸释放后合成的 mousedown，避免菜单被立即关闭
  document.addEventListener("mousedown", function (e) {
    if (Date.now() - lastLongPress < 500) {
      var inTree = e.target.closest && e.target.closest("#tree");
      var allow = e.target.closest && (e.target.closest("#ctxmenu") || e.target.closest(".ov-item"));
      if (inTree && !allow) {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }
  }, true);

  function mobile() { return mq.matches; }

  function hasHtmlFile() {
    var fs = window.WebPad && window.WebPad.fs;
    if (!fs || typeof fs.allFiles !== "function") return true;
    var files = fs.allFiles();
    for (var i = 0; i < files.length; i++) {
      if (/\.html?$/i.test(files[i].path)) return true;
    }
    return false;
  }

  function isEditorCommand(label) {
    return /新建|导入|导出|保存|关闭|撤销|重做|注释|复制|删除|全选|查找|替换|搜索|跳转|快速打开|折叠|展开|自动换行|重置|刷新项目|快捷键|关于/.test(label);
  }

  function syncTabs() {
    if (!tabbar) return;
    var drawer = body.classList.contains("m-sidebar");
    var view = body.classList.contains("m-preview") ? "preview" : "code";
    var tabs = tabbar.querySelectorAll("[data-mtab]");
    for (var i = 0; i < tabs.length; i++) {
      var name = tabs[i].getAttribute("data-mtab");
      var active = drawer ? name === "files" : name === view;
      tabs[i].classList.toggle("active", active);
      if (active) tabs[i].setAttribute("aria-current", "page");
      else tabs[i].removeAttribute("aria-current");
    }
  }

  function setView(view) {
    if (!mobile()) return;
    var target = view === "preview" ? "preview" : "code";
    body.classList.toggle("m-preview", target === "preview");
    body.classList.toggle("m-code", target === "code");
    syncTabs();
  }

  function openDrawer() {
    if (!mobile()) return;
    body.classList.add("m-sidebar");
    syncTabs();
    syncDrawerState();
    if (tree) setTimeout(function () {
      try { tree.focus({ preventScroll: true }); } catch (e) {}
    }, 230);
  }

  function closeDrawer() {
    var restore = mobile() && sidebar && sidebar.contains(document.activeElement);
    body.classList.remove("m-sidebar");
    syncTabs();
    syncDrawerState();
    if (restore && menuBtn) setTimeout(function () {
      try { menuBtn.focus({ preventScroll: true }); } catch (e) {}
    }, 0);
  }

  function syncDrawerState() {
    var open = body.classList.contains("m-sidebar");
    if (menuBtn) menuBtn.setAttribute("aria-expanded", open && mobile() ? "true" : "false");
    if (!sidebar) return;
    var backgrounds = ["titlebar", "toolbar", "center", "previewPane", "statusbar", "mobileTabbar"];
    for (var i = 0; i < backgrounds.length; i++) {
      var el = document.getElementById(backgrounds[i]);
      if (!el) continue;
      if (mobile() && open) el.setAttribute("inert", "");
      else el.removeAttribute("inert");
    }
    if (mobile()) {
      sidebar.setAttribute("aria-hidden", open ? "false" : "true");
      if (open) sidebar.removeAttribute("inert");
      else sidebar.setAttribute("inert", "");
    } else {
      sidebar.removeAttribute("aria-hidden");
      sidebar.removeAttribute("inert");
    }
  }

  function toggleDrawer() {
    if (body.classList.contains("m-sidebar")) closeDrawer();
    else openDrawer();
  }

  if (menuBtn) menuBtn.addEventListener("click", toggleDrawer);
  if (closeBtn) closeBtn.addEventListener("click", closeDrawer);
  if (backdrop) backdrop.addEventListener("click", closeDrawer);

  if (sidebar) sidebar.addEventListener("click", function (e) {
    if (!mobile()) return;
    var btn = e.target.closest ? e.target.closest('[data-cmd="file.new"]') : null;
    if (btn) setTimeout(function () {
      closeDrawer();
      setView("code");
    }, 60);
  });

  if (tabbar) tabbar.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-mtab]") : null;
    if (!btn) return;
    var view = btn.getAttribute("data-mtab");
    if (view === "files") {
      toggleDrawer();
      return;
    }
    closeDrawer();
    setView(view);
  });

  if (tree) {
    tree.addEventListener("click", function (e) {
      if (Date.now() - lastLongPress < 500) {
        lastLongPress = 0;
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (!mobile()) return;
      var row = e.target.closest ? e.target.closest(".tree-row") : null;
      if (!row) return;
      var fs = window.WebPad && window.WebPad.fs;
      var file = fs && typeof fs.get === "function" ? fs.get(row.dataset.path) : null;
      if (file && file.type === "file") {
        closeDrawer();
        setView("code");
      }
    }, true);

    var pressTimer = null;
    var pressTarget = null;
    var pressX = 0;
    var pressY = 0;
    var pressReady = false;

    function clearPress() {
      clearTimeout(pressTimer);
      pressTimer = null;
      pressReady = false;
      pressTarget = null;
    }

    function showContextMenu() {
      if (!pressTarget) return;
      var target = pressTarget;
      var isRow = target !== tree;
      var r = target.getBoundingClientRect();
      var x = isRow ? Math.min(r.left + 180, r.right - 20) : pressX;
      var y = isRow ? Math.min(r.top + 28, r.bottom - 8) : pressY;
      try {
        target.dispatchEvent(new MouseEvent("contextmenu", {
          bubbles: true,
          cancelable: true,
          clientX: x,
          clientY: y
        }));
      } catch (err) {}
    }

    tree.addEventListener("touchstart", function (e) {
      if (!e.touches || e.touches.length !== 1) return;
      var row = e.target.closest ? e.target.closest(".tree-row") : null;
      var t = e.touches[0];
      pressTarget = row || tree;
      pressX = t.clientX;
      pressY = t.clientY;
      clearTimeout(pressTimer);
      pressReady = false;
      pressTimer = setTimeout(function () {
        pressReady = true;
        if (navigator.vibrate) {
          try { navigator.vibrate(12); } catch (err) {}
        }
      }, 520);
    }, { passive: true });

    tree.addEventListener("touchmove", function (e) {
      if (!pressTimer && !pressReady) return;
      var t = e.touches && e.touches[0];
      if (!t) return;
      if (Math.abs(t.clientX - pressX) > 10 || Math.abs(t.clientY - pressY) > 10) clearPress();
    }, { passive: true });

    tree.addEventListener("touchend", function () {
      var open = pressReady;
      clearTimeout(pressTimer);
      pressTimer = null;
      pressReady = false;
      if (open) {
        // 等浏览器合成完 mousedown/click 再弹出菜单，避免菜单被立即关闭
        lastLongPress = Date.now();
        setTimeout(showContextMenu, 80);
      }
    }, { passive: true });

    tree.addEventListener("touchcancel", clearPress, { passive: true });
  }

  // 手机上预览面板的收起按钮改为切回代码页
  document.addEventListener("click", function (e) {
    if (!mobile()) return;
    var btn = e.target.closest ? e.target.closest("#togglePreview") : null;
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    setView("code");
  }, true);

  // 点工具栏“运行”后自动切到预览页
  document.addEventListener("click", function (e) {
    if (!mobile()) return;
    var btn = e.target.closest ? e.target.closest('[data-cmd="run.preview"]') : null;
    if (!btn) return;
    setTimeout(function () { if (window.WebPad && hasHtmlFile()) setView("preview"); }, 0);
  }, false);

  // 在预览页点其他工具栏按钮（新建、保存、撤销、查找等）时先回到代码页
  document.addEventListener("click", function (e) {
    if (!mobile()) return;
    var btn = e.target.closest ? e.target.closest("#toolbar [data-cmd]") : null;
    if (!btn || btn.getAttribute("data-cmd") === "run.preview") return;
    setView("code");
  }, true);

  document.addEventListener("click", function (e) {
    if (!mobile()) return;
    var btn = e.target.closest ? e.target.closest("#toolbar [data-cmd]") : null;
    if (!btn || btn.getAttribute("data-cmd") === "run.preview") return;
    setTimeout(function () { setView("code"); }, 0);
  }, false);

  // 命令面板 / 快速打开文件里的动作也同步切换页面
  // 先切换到代码页再执行命令，保证“查找”面板能获得焦点
  document.addEventListener("mousedown", function (e) {
    if (!mobile()) return;
    var item = e.target.closest ? e.target.closest(".ov-item") : null;
    if (!item) return;
    var input = document.getElementById("overlayInput");
    if (!input) return;
    if (input.placeholder.indexOf("命令") < 0) {
      if (input.placeholder.indexOf("文件名") >= 0) {
        closeDrawer();
        setView("code");
      }
      return;
    }
    var main = item.querySelector(".ov-main");
    var label = (main ? main.textContent : "").replace(/\s/g, "");
    if (isEditorCommand(label)) {
      closeDrawer();
      setView("code");
    }
  }, true);

  document.addEventListener("mousedown", function (e) {
    if (!mobile()) return;
    var item = e.target.closest ? e.target.closest(".ov-item") : null;
    if (!item) return;
    var input = document.getElementById("overlayInput");
    if (!input) return;
    var isCommand = input.placeholder.indexOf("命令") >= 0;
    var isFile = !isCommand && input.placeholder.indexOf("文件名") >= 0;
    if (isFile) {
      setTimeout(function () { setView("code"); }, 20);
      return;
    }
    if (!isCommand) return;
    var main = item.querySelector(".ov-main");
    var label = (main ? main.textContent : "").replace(/\s/g, "");
    if (label.indexOf("运行到预览") >= 0 || label.indexOf("刷新预览") >= 0) {
      setTimeout(function () {
        if (hasHtmlFile()) {
          closeDrawer();
          setView("preview");
        }
      }, 20);
    } else if (label.indexOf("显示/隐藏预览") >= 0) {
      setTimeout(function () {
        closeDrawer();
        setView(body.classList.contains("no-preview") ? "code" : "preview");
      }, 20);
    } else if (isEditorCommand(label)) {
      setTimeout(function () { setView("code"); }, 20);
    }
  }, false);

  // 文件树长按/右键菜单里的“在预览中打开”确保预览面板可见
  document.addEventListener("mousedown", function (e) {
    var item = e.target.closest ? e.target.closest("#ctxmenu .ctx-item") : null;
    if (!item) return;
    var label = item.textContent.replace(/\s/g, "");
    if (label.indexOf("在预览中打开") >= 0) {
      body.classList.remove("no-preview");
      if (mobile()) {
        closeDrawer();
        setTimeout(function () { setView("preview"); }, 20);
      }
    } else if (label.indexOf("新建文件") >= 0 && label.indexOf("新建文件夹") < 0) {
      if (mobile()) {
        setTimeout(function () {
          closeDrawer();
          setView("code");
        }, 20);
      }
    }
  }, false);

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || !body.classList.contains("m-sidebar")) return;
    var ctx = document.getElementById("ctxmenu");
    var overlayOpen = false;
    var overlays = document.querySelectorAll(".overlay");
    for (var i = 0; i < overlays.length; i++) {
      if (!overlays[i].hidden && getComputedStyle(overlays[i]).display !== "none") overlayOpen = true;
    }
    if ((!ctx || ctx.hidden) && !overlayOpen) closeDrawer();
  }, true);

  function onViewportChange() {
    if (!mq.matches) closeDrawer();
    else {
      if (!body.classList.contains("m-preview")) body.classList.add("m-code");
      syncTabs();
      syncDrawerState();
    }
    syncToggleLabel();
  }
  if (mq.addEventListener) mq.addEventListener("change", onViewportChange);
  else if (mq.addListener) mq.addListener(onViewportChange);

  function syncToggleLabel() {
    var toggle = document.getElementById("togglePreview");
    if (!toggle) return;
    var label = mobile() ? "返回代码" : "收起预览";
    toggle.title = label;
    toggle.setAttribute("aria-label", label);
  }

  // 给命令面板和新建/重命名等输入浮层加一个手机可见的关闭按钮
  function addOverlayCloseButtons() {
    var boxes = document.querySelectorAll(".overlay-box");
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i];
      if (box.querySelector(".overlay-close")) continue;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "overlay-close";
      btn.setAttribute("aria-label", "关闭");
      btn.textContent = "✕";
      btn.addEventListener("click", function () {
        var input = this.parentNode.querySelector("input");
        if (input) {
          input.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        } else {
          var ov = this.parentNode.closest(".overlay");
          if (ov) ov.hidden = true;
        }
      });
      box.appendChild(btn);
    }
  }
  addOverlayCloseButtons();
  if (window.MutationObserver) {
    new MutationObserver(addOverlayCloseButtons).observe(document.body, { childList: true });
  }

  // 给图标按钮补上可读名称，方便手机读屏
  function addButtonLabels() {
    var els = document.querySelectorAll("#toolbar .tbtn[title], #panel .mini[title], #previewPane .mini[title], #sidebar .mini[title]");
    for (var i = 0; i < els.length; i++) {
      if (els[i].getAttribute("aria-label")) continue;
      var title = els[i].getAttribute("title") || "";
      els[i].setAttribute("aria-label", title.replace(/\s*\([^)]*\)\s*$/, ""));
    }
    var closers = document.querySelectorAll("#tabs .tab-close");
    for (var j = 0; j < closers.length; j++) {
      if (!closers[j].getAttribute("aria-label")) closers[j].setAttribute("aria-label", "关闭标签");
    }
  }
  addButtonLabels();
  syncToggleLabel();
  var tabsEl = document.getElementById("tabs");
  if (tabsEl && window.MutationObserver) {
    new MutationObserver(addButtonLabels).observe(tabsEl, { childList: true, subtree: true });
  }

  if (!body.classList.contains("m-preview")) body.classList.add("m-code");
  syncTabs();
  syncDrawerState();
})();
</script>

</body>
</html>
