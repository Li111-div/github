<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的网页导航</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f1117;
    --card:#171a23;
    --card-hi:#1c202b;
    --border:#262a36;
    --txt:#e8eaf0;
    --muted:#8b93a7;
    --faint:#5b6377;
    --accent:#4f7cff;
    --accent-soft:rgba(79,124,255,.14);
    --star:#f5b942;
    --shadow:0 8px 28px rgba(0,0,0,.4);
    --radius:12px;
  }
  html[data-theme="light"]{
    --bg:#f4f5f8;
    --card:#ffffff;
    --card-hi:#fafbfd;
    --border:#e3e6ed;
    --txt:#1b1e27;
    --muted:#697085;
    --faint:#9aa1b2;
    --accent:#2f5fe0;
    --accent-soft:rgba(47,95,224,.10);
    --star:#e0a02a;
    --shadow:0 6px 22px rgba(20,30,60,.09);
  }
  html{scroll-behavior:smooth}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .25s,color .25s;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:44px 22px 70px}

  /* ============ 头部 ============ */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
  .brand h1{font-size:26px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
  .brand h1::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--accent)}
  .brand p{color:var(--muted);font-size:13.5px;margin-top:9px;padding-left:16px}
  .brand p b{color:var(--txt);font-weight:600}
  .head-actions{display:flex;gap:8px}

  .iconbtn{
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;
    background:var(--card);border:1px solid var(--border);color:var(--muted);
    transition:all .18s;font-size:15px;
  }
  .iconbtn:hover{color:var(--txt);border-color:var(--accent);background:var(--card-hi)}

  /* ============ 工具栏 ============ */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 22px}
  .search{
    flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
    padding:11px 15px;border-radius:var(--radius);
    background:var(--card);border:1px solid var(--border);transition:border-color .2s;
  }
  .search:focus-within{border-color:var(--accent)}
  .search svg{flex:none;color:var(--faint)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14.5px;font-family:inherit}
  .search input::placeholder{color:var(--faint)}
  .search .clr{cursor:pointer;color:var(--faint);display:none;font-size:15px;line-height:1}
  .search.has .clr{display:block}
  .search .clr:hover{color:var(--txt)}

  select.sel{
    padding:11px 12px;border-radius:var(--radius);font-size:13.5px;font-family:inherit;cursor:pointer;
    background:var(--card);border:1px solid var(--border);color:var(--txt);outline:none;
  }
  select.sel:hover{border-color:var(--accent)}

  .seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:3px;gap:3px}
  .seg button{
    border:none;background:none;cursor:pointer;color:var(--muted);font-family:inherit;
    padding:8px 12px;border-radius:9px;font-size:13px;display:grid;place-items:center;transition:all .18s;
  }
  .seg button.on{background:var(--accent-soft);color:var(--accent)}
  .seg button:hover:not(.on){color:var(--txt)}

  /* ============ 分类筛选 ============ */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
  .chip{
    padding:8px 15px;border-radius:999px;font-size:13.5px;cursor:pointer;user-select:none;font-weight:500;
    background:var(--card);border:1px solid var(--border);color:var(--muted);transition:all .18s;
  }
  .chip:hover{color:var(--txt);border-color:var(--accent)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.65;font-size:12px;margin-left:5px}

  /* ============ 分组 ============ */
  section{margin-bottom:34px;animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:15px;font-weight:650;letter-spacing:.2px}
  .sec-head .count{font-size:12px;color:var(--muted)}
  .sec-head .line{flex:1;height:1px;background:var(--border)}
  .sec-head .mini{
    font-size:12px;color:var(--muted);cursor:pointer;padding:3px 9px;border-radius:7px;
    border:1px solid var(--border);background:none;font-family:inherit;transition:all .18s;
  }
  .sec-head .mini:hover{color:var(--txt);border-color:var(--accent)}

  /* ============ 卡片 ============ */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:10px}
  .list .grid{grid-template-columns:1fr}

  .card{
    display:flex;align-items:center;gap:12px;position:relative;
    padding:12px 12px 12px 14px;border-radius:var(--radius);
    background:var(--card);border:1px solid var(--border);
    transition:border-color .18s,background .18s,transform .18s,box-shadow .18s;
  }
  .card:hover{border-color:var(--accent);background:var(--card-hi);transform:translateY(-2px);box-shadow:var(--shadow)}
  .card-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:inherit}
  .ico{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:var(--accent-soft)}
  .meta{min-width:0;flex:1}
  .name{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .path{display:block;font-size:11.5px;color:var(--muted);font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .acts{display:flex;gap:2px;flex:none}
  .acts button{
    width:30px;height:30px;border-radius:8px;border:none;background:none;cursor:pointer;
    color:var(--faint);display:grid;place-items:center;font-size:14px;transition:all .18s;
  }
  .acts button:hover{background:var(--accent-soft);color:var(--accent)}
  .acts .fav.on{color:var(--star)}
  .card.is-fav{border-color:rgba(245,185,66,.42)}

  /* 空状态 */
  .empty{text-align:center;padding:64px 20px;color:var(--muted);display:none}
  .empty .big{font-size:44px;margin-bottom:14px;opacity:.5}
  .empty p{font-size:14.5px}

  /* ============ 提示条 ============ */
  #toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
    background:var(--txt);color:var(--bg);padding:10px 20px;border-radius:10px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:all .28s;z-index:60;font-weight:500;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  footer{
    text-align:center;color:var(--faint);font-size:12.5px;padding-top:24px;
    border-top:1px solid var(--border);line-height:1.9;margin-top:10px;
  }
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}

  @media(max-width:560px){
    .wrap{padding:30px 15px 56px}
    .grid{grid-template-columns:1fr}
    .brand h1{font-size:22px}
    .search{min-width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>我的网页导航</h1>
      <p>共 <b id="statTotal">0</b> 个网页 · <b id="statFav">0</b> 个收藏 · 点击卡片在新标签页打开</p>
    </div>
    <div class="head-actions">
      <button class="iconbtn" id="btnRandom" title="随机打开一个">🎲</button>
      <button class="iconbtn" id="btnTheme" title="切换深色 / 浅色">🌙</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search" id="searchBox">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="搜索网页名称或地址…" autocomplete="off">
      <span class="clr" id="clr">✕</span>
    </div>
    <select class="sel" id="sort">
      <option value="default">默认排序</option>
      <option value="az">名称 A → Z</option>
      <option value="za">名称 Z → A</option>
    </select>
    <div class="seg">
      <button id="viewGrid" class="on" title="网格视图">▦</button>
      <button id="viewList" title="列表视图">☰</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <div id="content"></div>

  <div class="empty" id="empty">
    <div class="big">🔍</div>
    <p>没有找到匹配的网页，换个关键词试试</p>
  </div>

  <footer>
    主站地址：<a href="https://www.fyzyjsxx.cc.cd/" target="_blank" rel="noopener">https://www.fyzyjsxx.cc.cd/</a><br>
    我的网页导航 · 本地静态页面
  </footer>
</div>

<div id="toast"></div>

<script>
const BASE = "https://www.fyzyjsxx.cc.cd";

const DATA = [
  /* ---- 工具 & 查找 ---- */
  { cat:"tools", name:"主网页",            path:"/",                    ico:"🏠" },
  { cat:"tools", name:"CSS查找",           path:"/CSScz",               ico:"🎨" },
  { cat:"tools", name:"HTML查找",          path:"/HTMLcz",              ico:"📄" },
  { cat:"tools", name:"JS查找",            path:"/JScz",                ico:"⚡" },
  { cat:"tools", name:"MUI查找",           path:"/MUIcz",               ico:"🧩" },
  { cat:"tools", name:"动画查找",          path:"/donghua",             ico:"🎬" },
  { cat:"tools", name:"密码工具箱",        path:"/mima",                ico:"🔐" },

  /* ---- 创意网页 ---- */
  { cat:"pages", name:"冰箱网页",          path:"/bingxiang",           ico:"🧊" },
  { cat:"pages", name:"地球网页",          path:"/diqiu",               ico:"🌍" },
  { cat:"pages", name:"古村网页",          path:"/gucun",               ico:"🏘️" },
  { cat:"pages", name:"美食网页",          path:"/meishi",              ico:"🍜" },
  { cat:"pages", name:"请假网页（整蛊）",  path:"/qingjia",             ico:"🏖️" },
  { cat:"pages", name:"全球人口统计",      path:"/renkou",              ico:"📊" },
  { cat:"pages", name:"显卡性能对比",      path:"/xianka",              ico:"🖥️" },
  { cat:"pages", name:"校园论坛网页",      path:"/tiezi-bata-v3.0",     ico:"💬" },

  /* ---- 天气网页 ---- */
  { cat:"tianqi", name:"天气网页 v1.0",    path:"/tianqi-v1.0",         ico:"⛅" },
  { cat:"tianqi", name:"天气网页 v2.0",    path:"/tianqi-v2.0",         ico:"🌤️" },

  /* ---- 俄罗斯方块 ---- */
  { cat:"elsfk", name:"俄罗斯方块 v1.0",        path:"/elsfk-v1.0",        ico:"🟦" },
  { cat:"elsfk", name:"俄罗斯方块 v1.0 进阶版", path:"/elsfk-v1.0-ultra", ico:"🟪" },
  { cat:"elsfk", name:"俄罗斯方块 v2.0",        path:"/elsfk-v2.0",        ico:"🟦" },
  { cat:"elsfk", name:"俄罗斯方块 v3.0",        path:"/elsfk-v3.0",        ico:"🟦" },

  /* ---- 贪吃蛇 ---- */
  { cat:"tanchishe", name:"贪吃蛇 v1.0",       path:"/tanchishe-v1.0",      ico:"🐍" },
  { cat:"tanchishe", name:"贪吃蛇 v2.0",       path:"/tanchishe-v2.0",      ico:"🐍" },
  { cat:"tanchishe", name:"贪吃蛇 v3.0",       path:"/tanchishe-v3.0",      ico:"🐍" },
  { cat:"tanchishe", name:"贪吃蛇 v4.0测试版", path:"/tanchishe-v4.0-bata", ico:"🐍" },
  { cat:"tanchishe", name:"贪吃蛇 v4.0",       path:"/tanchishe-v4.0",      ico:"🐍" },

  /* ---- 跳一跳 ---- */
  { cat:"tiaoyitiao", name:"跳一跳 v1.0",      path:"/tiaoyitiao-v1.0",     ico:"🎯" },
  { cat:"tiaoyitiao", name:"跳一跳 v2.0",      path:"/tiaoyitiao-v2.0",     ico:"🎯" },
  { cat:"tiaoyitiao", name:"跳一跳 v2.5",      path:"/tiaoyitiao-v2.5",     ico:"🎯" },

  /* ---- 棋类 & 益智 ---- */
  { cat:"board", name:"五子棋游戏",            path:"/wiziqi",              ico:"⚫" },
  { cat:"board", name:"围棋游戏",              path:"/weiqi",               ico:"⚪" },
  { cat:"board", name:"扫雷游戏",              path:"/saolei",              ico:"💣" },

  /* ---- 我的世界 ---- */
  { cat:"mc", name:"我的世界新蒸程整合包",     path:"/mozu",                ico:"⛏️" },
  { cat:"mc", name:"我的世界pcl启动器",        path:"/pcl",                 ico:"🧱" }
];

const CATS = [
  { key:"all",        label:"全部",          ico:"🗂️" },
  { key:"tools",      label:"工具 & 查找",   ico:"🛠️" },
  { key:"pages",      label:"创意网页",      ico:"🎨" },
  { key:"tianqi",     label:"天气网页",      ico:"⛅" },
  { key:"elsfk",      label:"俄罗斯方块",    ico:"🟦" },
  { key:"tanchishe",  label:"贪吃蛇",        ico:"🐍" },
  { key:"tiaoyitiao", label:"跳一跳",        ico:"🎯" },
  { key:"board",      label:"棋类 & 益智",   ico:"♟️" },
  { key:"mc",         label:"我的世界",      ico:"⛏️" }
];

/* ================= 状态 ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let favs     = LS.get("nav.fav", []);
let recents  = LS.get("nav.recent", []);
let view     = LS.get("nav.view", "grid");
let sortMode = LS.get("nav.sort", "default");
let theme    = LS.get("nav.theme", "dark");
let activeCat = "all";
let keyword = "";

const url  = p => BASE + p;

/* ================= 主题 ================= */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("btnTheme").textContent = theme === "dark" ? "🌙" : "☀️";
}
document.getElementById("btnTheme").onclick = () => {
  theme = theme === "dark" ? "light" : "dark";
  LS.set("nav.theme", theme); applyTheme();
};

/* ================= 视图 / 排序 ================= */
function applyView(){
  document.getElementById("content").classList.toggle("list", view === "list");
  document.getElementById("viewGrid").classList.toggle("on", view === "grid");
  document.getElementById("viewList").classList.toggle("on", view === "list");
}
document.getElementById("viewGrid").onclick = () => { view = "grid"; LS.set("nav.view", view); applyView(); };
document.getElementById("viewList").onclick = () => { view = "list"; LS.set("nav.view", view); applyView(); };

document.getElementById("sort").value = sortMode;
document.getElementById("sort").onchange = e => { sortMode = e.target.value; LS.set("nav.sort", sortMode); render(); };

/* ================= 分类筛选 ================= */
function buildFilters(){
  const el = document.getElementById("filters");
  el.innerHTML = "";
  CATS.forEach(c => {
    const n = c.key === "all" ? DATA.length : DATA.filter(d => d.cat === c.key).length;
    const b = document.createElement("div");
    b.className = "chip" + (c.key === activeCat ? " active" : "");
    b.innerHTML = c.ico + " " + c.label + '<span class="n">' + n + "</span>";
    b.onclick = () => { activeCat = c.key; buildFilters(); render(); };
    el.appendChild(b);
  });
}

/* ================= 卡片 ================= */
function cardHTML(d){
  const on = favs.indexOf(d.path) > -1;
  return '<div class="card' + (on ? " is-fav" : "") + '" data-path="' + d.path + '">' +
    '<a class="card-main" href="' + url(d.path) + '" target="_blank" rel="noopener" title="' + url(d.path) + '">' +
      '<span class="ico">' + d.ico + "</span>" +
      '<span class="meta"><span class="name">' + d.name + '</span><span class="path">' + d.path + "</span></span>" +
    "</a>" +
    '<span class="acts">' +
      '<button class="fav' + (on ? " on" : "") + '" data-act="fav" title="' + (on ? "取消收藏" : "收藏") + '">' + (on ? "★" : "☆") + "</button>" +
      '<button data-act="copy" title="复制链接">⧉</button>' +
    "</span>" +
  "</div>";
}

function sortList(list){
  const l = list.slice();
  if(sortMode === "az") l.sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN", { numeric:true }));
  if(sortMode === "za") l.sort((a, b) => b.name.localeCompare(a.name, "zh-Hans-CN", { numeric:true }));
  return l;
}

/* ================= 渲染 ================= */
function render(){
  const kw = keyword.trim().toLowerCase();
  const match = d =>
    (activeCat === "all" || d.cat === activeCat) &&
    (!kw || d.name.toLowerCase().indexOf(kw) > -1 || d.path.toLowerCase().indexOf(kw) > -1);

  const content = document.getElementById("content");
  content.innerHTML = "";

  const favItems = sortList(DATA.filter(d => favs.indexOf(d.path) > -1 && match(d)));
  const recItems = DATA
    .filter(d => recents.indexOf(d.path) > -1 && favs.indexOf(d.path) === -1 && match(d))
    .sort((a, b) => recents.indexOf(a.path) - recents.indexOf(b.path));

  let shown = 0;
  if(favItems.length){ content.appendChild(section("⭐ 我的收藏", favItems, "fav")); shown += favItems.length; }
  if(recItems.length){ content.appendChild(section("🕘 最近访问", recItems, "recent")); shown += recItems.length; }

  CATS.filter(c => c.key !== "all").forEach(c => {
    const items = sortList(DATA.filter(d => d.cat === c.key && match(d)));
    if(!items.length) return;
    content.appendChild(section(c.ico + " " + c.label, items, null));
    shown += items.length;
  });

  document.getElementById("empty").style.display = shown ? "none" : "block";
  document.getElementById("statTotal").textContent = DATA.length;
  document.getElementById("statFav").textContent = favs.length;
}

function section(title, items, clearKind){
  const s = document.createElement("section");
  s.innerHTML =
    '<div class="sec-head">' +
      "<h2>" + title + "</h2>" +
      '<span class="count">' + items.length + " 个</span>" +
      '<span class="line"></span>' +
      (clearKind ? '<button class="mini">清空</button>' : "") +
    "</div>" +
    '<div class="grid">' + items.map(cardHTML).join("") + "</div>";

  const mini = s.querySelector(".mini");
  if(mini){
    mini.onclick = () => {
      if(clearKind === "fav"){ favs = []; LS.set("nav.fav", favs); }
      else { recents = []; LS.set("nav.recent", recents); }
      render();
    };
  }
  return s;
}

/* ================= 交互（事件委托） ================= */
document.addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  const card = e.target.closest(".card");

  if(btn && card){
    e.preventDefault();
    const p = card.dataset.path;
    if(btn.dataset.act === "fav"){
      const i = favs.indexOf(p);
      if(i > -1){ favs.splice(i, 1); toast("已取消收藏"); }
      else { favs.push(p); toast("已加入收藏"); }
      LS.set("nav.fav", favs);
      render();
    } else {
      copy(url(p));
    }
    return;
  }

  const link = e.target.closest(".card-main");
  if(link && card){
    const p = card.dataset.path;
    recents = [p].concat(recents.filter(x => x !== p)).slice(0, 8);
    LS.set("nav.recent", recents);
  }
});

/* 复制链接 */
function copy(text){
  const done = () => toast("链接已复制");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
  } else {
    fallback(text, done);
  }
}
function fallback(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ toast("复制失败，请手动复制"); }
  document.body.removeChild(ta);
}

/* 提示条 */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

/* 随机打开 */
document.getElementById("btnRandom").onclick = () => {
  const pool = DATA.filter(d => activeCat === "all" || d.cat === activeCat);
  const d = pool[Math.floor(Math.random() * pool.length)];
  if(!d) return;
  recents = [d.path].concat(recents.filter(x => x !== d.path)).slice(0, 8);
  LS.set("nav.recent", recents);
  window.open(url(d.path), "_blank", "noopener");
  toast("随机打开：" + d.name);
};

/* 搜索 */
const qEl = document.getElementById("q");
const boxEl = document.getElementById("searchBox");
qEl.addEventListener("input", e => {
  keyword = e.target.value;
  boxEl.classList.toggle("has", !!keyword);
  render();
});
document.getElementById("clr").onclick = () => {
  qEl.value = ""; keyword = ""; boxEl.classList.remove("has"); render(); qEl.focus();
};
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
  if(e.key === "Escape" && document.activeElement === qEl){
    qEl.value = ""; keyword = ""; boxEl.classList.remove("has"); render(); qEl.blur();
  }
});

/* ================= 启动 ================= */
applyTheme();
applyView();
buildFilters();
render();
</script>
</body>
