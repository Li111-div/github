<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 属性大全</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fafbfc;
  --sidebar-bg:#2c3e50;
  --sidebar-hover:#34495e;
  --sidebar-active:#3498db;
  --text:#2c3e50;
  --text-light:#7f8c8d;
  --card-bg:#fff;
  --card-border:#e1e4e8;
  --accent:#3498db;
  --accent-light:#ebf5fb;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --shadow-hover:0 4px 16px rgba(0,0,0,0.12);
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
}
.sidebar{
  position:fixed;top:0;left:0;width:240px;height:100vh;
  background:var(--sidebar-bg);color:#fff;
  overflow-y:auto;z-index:100;
  transition:transform .3s ease;
}
.sidebar-header{
  padding:20px;border-bottom:1px solid rgba(255,255,255,.1);
  font-size:18px;font-weight:700;text-align:center;
}
.sidebar-header span{color:var(--accent)}
.sidebar-nav{padding:10px 0}
.nav-group{margin-bottom:4px}
.nav-group-title{
  padding:10px 20px;font-size:13px;color:rgba(255,255,255,.5);
  text-transform:uppercase;letter-spacing:1px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
}
.nav-group-title .arrow{transition:transform .2s;font-size:10px;cursor:pointer;padding:2px 4px;border-radius:3px}
.nav-group-title .arrow:hover{background:rgba(255,255,255,.15)}
.nav-group.collapsed .arrow{transform:rotate(-90deg)}
.nav-group.collapsed .nav-items{display:none}
.nav-items{list-style:none}
.nav-items li{
  padding:8px 20px 8px 30px;font-size:14px;cursor:pointer;
  transition:all .2s;border-left:3px solid transparent;
}
.nav-items li:hover{background:var(--sidebar-hover)}
.nav-items li.active{background:var(--sidebar-active);border-left-color:#fff}
.main{margin-left:240px;padding:30px;transition:margin-left .3s ease}
.top-bar{
  position:sticky;top:0;z-index:50;
  background:var(--bg);padding-bottom:15px;
  margin-bottom:20px;border-bottom:1px solid var(--card-border);
}
.menu-toggle{
  display:none;background:var(--sidebar-bg);color:#fff;
  border:none;padding:8px 14px;border-radius:6px;font-size:16px;
  cursor:pointer;margin-bottom:15px;
}
.search-box{position:relative;max-width:500px}
.search-box input{
  width:100%;padding:12px 16px 12px 42px;
  border:2px solid var(--card-border);border-radius:8px;
  font-size:15px;background:#fff;transition:border-color .2s;outline:none;
}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--text-light);
}
.results-count{margin-top:10px;font-size:13px;color:var(--text-light)}
.category-section{margin-bottom:40px;scroll-margin-top:80px}
.category-title{
  font-size:22px;font-weight:700;margin-bottom:20px;
  padding-bottom:10px;border-bottom:2px solid var(--accent);
  display:flex;align-items:center;gap:10px;
}
.category-title .count{
  font-size:13px;background:var(--accent-light);
  color:var(--accent);padding:3px 10px;border-radius:12px;font-weight:500;
}
.props-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.prop-card{
  background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:10px;padding:16px;cursor:pointer;
  transition:all .25s;box-shadow:var(--shadow);
}
.prop-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.prop-card .prop-name{
  font-family:"SF Mono",Consolas,Monaco,monospace;
  font-size:16px;font-weight:700;color:var(--accent);margin-bottom:6px;
}
.prop-card .prop-desc{
  font-size:13px;color:var(--text-light);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.prop-card .prop-tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.prop-card .tag{font-size:11px;padding:2px 8px;border-radius:4px;background:#f0f3f5;color:var(--text-light)}
.prop-card .tag.common{background:#d5f5e3;color:#1e8449}
.prop-card .tag.less{background:#fadbd8;color:#c0392b}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light)}
.empty-state svg{width:64px;height:64px;margin-bottom:15px;opacity:.4}
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:1000;display:none;align-items:center;justify-content:center;
  padding:20px;animation:fadeIn .2s ease;
}
.modal-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:12px;max-width:640px;width:100%;
  max-height:85vh;overflow-y:auto;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--card-border);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-family:"SF Mono",Consolas,Monaco,monospace;color:var(--accent);font-size:22px}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-light);line-height:1;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px}
.modal-body h3{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin:20px 0 10px;font-weight:600}
.modal-body h3:first-child{margin-top:0}
.modal-body p{margin-bottom:10px;font-size:14px}
.modal-body .prop-value{
  font-family:"SF Mono",Consolas,Monaco,monospace;
  background:#f8f9fa;padding:12px 16px;border-radius:6px;
  font-size:13px;color:#e74c3c;margin:8px 0;white-space:pre-wrap;word-break:break-all;
}
.modal-body table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.modal-body th,.modal-body td{padding:8px 12px;text-align:left;border:1px solid var(--card-border)}
.modal-body th{background:#f8f9fa;font-weight:600}
.modal-body code{font-family:"SF Mono",Consolas,Monaco,monospace;background:#f0f3f5;padding:2px 6px;border-radius:3px;font-size:13px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.sidebar-overlay.show{display:block}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:20px}
  .menu-toggle{display:inline-block}
  .props-grid{grid-template-columns:1fr}
  .modal{max-height:90vh}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#f1f1f1}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#a8a8a8}
.sidebar::-webkit-scrollbar-track{background:var(--sidebar-bg)}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
.prop-card.highlight{animation:cardPulse 1.5s ease;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
@keyframes cardPulse{0%,100%{background:var(--card-bg)}50%{background:var(--accent-light)}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">CSS <span>属性大全</span></div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<main class="main">
  <div class="top-bar">
    <button class="menu-toggle" id="menuToggle">&#9776; 菜单</button>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="搜索 CSS 属性...">
    </div>
    <div class="results-count" id="resultsCount"></div>
  </div>
  <div id="content"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" id="modalClose">&#10005;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
