<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript 速查手册 · JS Cheat Sheet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2329;
    --text-soft: #646a73;
    --text-fade: #8a8f99;
    --border: #e5e6eb;
    --primary: #3370ff;
    --primary-soft: #e8f0ff;
    --code-bg: #2b303b;
    --code-text: #cdd3de;
    --shadow: 0 2px 8px rgba(0,0,0,.06);
    --shadow-hover: 0 6px 18px rgba(0,0,0,.1);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }

  /* 顶栏 */
  header.topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 11px 20px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
  }
  header.topbar .brand {
    font-weight: 700; font-size: 17px; color: var(--primary);
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  header.topbar .brand small { color: var(--text-fade); font-weight: 400; font-size: 12px; }
  .search-wrap { flex: 1; min-width: 220px; max-width: 520px; position: relative; }
  .search-wrap input {
    width: 100%; padding: 9px 14px 9px 36px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: var(--card); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .search-wrap svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--text-fade); pointer-events: none;
  }
  .search-count { font-size: 12px; color: var(--text-fade); white-space: nowrap; }
  .clear-btn {
    background: none; border: none; color: var(--text-fade);
    cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 4px;
    display: none;
  }
  .clear-btn:hover { color: var(--text); background: var(--bg); }

  /* 布局 */
  .layout { display: flex; max-width: 1320px; margin: 0 auto; }

  /* 侧栏 */
  aside.sidebar {
    width: 260px; flex-shrink: 0;
    position: sticky; top: 57px;
    height: calc(100vh - 57px);
    overflow-y: auto;
    padding: 14px 10px 24px 18px;
    border-right: 1px solid var(--border);
    background: var(--card);
  }
  aside.sidebar::-webkit-scrollbar { width: 6px; }
  aside.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  aside.sidebar h3 {
    font-size: 11px; color: var(--text-fade);
    text-transform: uppercase; letter-spacing: .5px;
    margin: 12px 8px 6px; font-weight: 600;
  }
  aside.sidebar a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; color: var(--text-soft);
    text-decoration: none; font-size: 13px;
    border-radius: 6px; transition: background .15s, color .15s;
  }
  aside.sidebar a:hover { background: var(--primary-soft); color: var(--primary); }
  aside.sidebar a.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  aside.sidebar a .ico { font-size: 14px; width: 18px; text-align: center; }
  aside.sidebar a .cnt {
    margin-left: auto; font-size: 11px; color: var(--text-fade);
    background: var(--bg); padding: 1px 6px; border-radius: 8px;
  }
  aside.sidebar a.active .cnt { background: #fff; color: var(--primary); }

  .sidebar-toggle {
    display: none; position: fixed; bottom: 20px; right: 20px; z-index: 200;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--primary); color: #fff; border: none; cursor: pointer;
    box-shadow: 0 4px 12px rgba(51,112,255,.4);
    align-items: center; justify-content: center;
  }
  .sidebar-toggle svg { width: 22px; height: 22px; }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 140;
  }
  .sidebar-overlay.show { display: block; }

  /* 主体 */
  main.content { flex: 1; min-width: 0; padding: 22px 26px 80px; }
  .intro {
    background: linear-gradient(135deg, #3370ff 0%, #5b8def 100%);
    color: #fff; border-radius: 12px;
    padding: 22px 26px; margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(51,112,255,.2);
  }
  .intro h1 { font-size: 22px; margin-bottom: 6px; font-weight: 700; }
  .intro p { font-size: 13.5px; opacity: .92; }
  .intro .stats { margin-top: 10px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; opacity: .9; }
  .intro .stats b { font-size: 15px; font-weight: 700; }

  section.category { margin-bottom: 32px; scroll-margin-top: 72px; }
  section.category > h2 {
    font-size: 18px; font-weight: 700;
    padding: 6px 0 10px; margin-bottom: 12px;
    border-bottom: 2px solid var(--primary);
    display: flex; align-items: center; gap: 8px;
  }
  section.category > h2 .ico { font-size: 20px; }
  section.category > h2 .badge {
    font-size: 11px; font-weight: 500; color: var(--text-fade);
    background: var(--bg); padding: 2px 8px; border-radius: 10px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }

  /* 卡片 */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 15px;
    box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s, border-color .15s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); border-color: var(--primary); }
  .card-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .card-head .name {
    font-family: "SF Mono", "JetBrains Mono", Consolas, Monaco, monospace;
    font-size: 13.5px; font-weight: 700; color: var(--primary);
  }
  .card-head .tag {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: var(--bg); color: var(--text-fade);
  }
  .card-head .tag.hot { background: #fff1e6; color: #e3680a; }
  .card-head .tag.common { background: #e8f0ff; color: var(--primary); }
  .card-head .tag.rare { background: #f0f0f0; color: #909399; }
  .card-head .tag.deprecated { background: #fde2e2; color: #c45656; }
  .card-desc { color: var(--text-soft); font-size: 12.5px; margin-bottom: 8px; flex: 1; }
  pre.code {
    background: var(--code-bg); color: var(--code-text);
    border-radius: 6px; padding: 9px 11px; overflow-x: auto;
    font-family: "SF Mono", "JetBrains Mono", Consolas, Monaco, monospace;
    font-size: 12px; line-height: 1.55;
    margin: 0;
  }
  pre code .kw { color: #c678dd; }
  pre code .str { color: #98c379; }
  pre code .num { color: #d19a66; }
  pre code .com { color: #7d8799; font-style: italic; }
  pre code .fn { color: #61afef; }
  pre code .prop { color: #e5c07b; }

  .empty-tip {
    text-align: center; color: var(--text-fade);
    padding: 60px 20px; font-size: 15px; display: none;
  }
  .empty-tip.show { display: block; }
  .hidden { display: none !important; }

  footer {
    text-align: center; color: var(--text-fade);
    padding: 30px 20px; font-size: 12px;
  }
  footer a { color: var(--primary); text-decoration: none; }

  /* 响应式 */
  @media (max-width: 860px) {
    aside.sidebar {
      position: fixed; top: 0; left: 0;
      width: 80%; max-width: 300px;
      height: 100vh; z-index: 150;
      transform: translateX(-100%);
      transition: transform .25s ease;
      padding-top: 60px;
    }
    aside.sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: flex; }
    main.content { padding: 16px 14px 80px; }
    header.topbar { padding: 10px 14px; gap: 10px; }
    header.topbar .brand { font-size: 15px; }
    header.topbar .brand small { display: none; }
    .intro { padding: 18px; }
    .intro h1 { font-size: 19px; }
    .grid { grid-template-columns: 1fr; gap: 10px; }
    section.category > h2 { font-size: 16px; }
  }
  @media (max-width: 480px) {
    .search-count { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">📘 JS 速查手册 <small>JavaScript Cheat Sheet</small></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="search" type="text" placeholder="搜索 JS 语句 / 方法 / API…" autocomplete="off">
  </div>
  <div class="search-count" id="searchCount"></div>
  <button class="clear-btn" id="clearBtn">清除</button>
</header>

<button class="sidebar-toggle" id="sidebarToggle" aria-label="目录">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>分类目录</h3>
    <div id="navList"></div>
  </aside>

  <main class="content" id="content">
    <div class="intro">
      <h1>JavaScript 速查手册</h1>
      <p>覆盖语句、内置对象、DOM、BOM、ES6+、异步等核心知识，按热度排序，支持搜索快速定位。</p>
      <div class="stats" id="stats"></div>
    </div>
    <div id="sections"></div>
    <div class="empty-tip" id="emptyTip">未找到匹配项，换个关键词试试 ✨</div>
    <footer>📘 JavaScript 速查手册 · 数据基于 ES2023 标准 · 仅供参考</footer>
  </main>
</div>

<script>
/* ============================
 *  数据：JS 知识体系（分类+条目）
 *  条目格式: [name, tag, desc, code]
 *  tag: hot(常用) / common(普通) / rare(少见) / deprecated(已废弃)
 * ============================ */
const DATA = [
  {
    id: 'variables', icon: '📦', title: '变量与声明',
    items: [
      ['let', 'common', '声明块级作用域的局部变量，可重新赋值。存在暂时性死区（TDZ），声明前访问会报错。', 'let count = 0;\ncount = 5;'],
      ['const', 'common', '声明块级作用域的常量，必须初始化。基本类型不可改；引用类型绑定不可变但内部可改。', 'const PI = 3.14;\nconst arr = [1,2];\narr.push(3); // OK'],
      ['var', 'common', '函数级/全局作用域变量，会被提升（hoisting），初始为 undefined。现代代码建议用 let/const。', 'var x = 1;\nfunction f(){ var y = 2; }'],
      ['解构赋值', 'common', '从数组/对象按模式提取值。支持默认值、剩余元素、嵌套解构、变量交换。', 'const {a, b=2, ...rest} = obj;\nconst [x, , z] = [1,2,3];\n// 变量交换（需要提前用 let 声明）\nlet i = 1, j = 2;\n[i, j] = [j, i];'],
      ['import', 'common', '静态导入 ES 模块的导出绑定。支持具名/默认/命名空间/动态 import()。', 'import React from "react";\nimport {useState} from "react";\nconst m = await import("./m");'],
      ['export', 'common', '从 ES 模块导出值（变量/函数/类），支持具名导出与默认导出。', 'export const PI = 3.14;\nexport default function App(){}'],
    ]
  },
  {
    id: 'control', icon: '🔀', title: '控制流程',
    items: [
      ['if...else', 'hot', '根据条件真假执行分支，支持 else if 链。条件会被强制转布尔。', 'if (x > 0) pos();\nelse if (x < 0) neg();\nelse zero();'],
      ['switch', 'common', '多分支选择，用 === 严格匹配 case；配合 break 阻止穿透，default 处理其他。', 'switch(color){\n  case "red": a(); break;\n  case "blue": b(); break;\n  default: d();\n}'],
      ['三元运算符 ? :', 'hot', 'condition ? a : b，根据条件返回其一表达式。可嵌套但建议适度。', 'const m = age>=18 ? "成年" : "未成年";'],
      ['try...catch...finally', 'common', '捕获同步运行时错误。try 抛错被 catch 捕获；finally 必执行。不捕获异步错误。', 'try { risky(); }\ncatch(e){ console.error(e); }\nfinally { cleanup(); }'],
      ['throw', 'common', '主动抛出异常（建议 Error 对象）。throw 后代码不再执行。', 'function div(a, b){\n  if (b === 0) throw new RangeError("除零");\n  return a / b;\n}'],
      ['空语句 ;', 'rare', '仅分号，不执行任何操作。多用于循环体为空时占位。', 'let i = 0;\n// 空循环体，每次仅执行 while 的条件与 i++\nwhile (++i < 5) ;\nconsole.log(i); // 5'],
      ['with', 'deprecated', '把对象属性扩展到块作用域。已废弃：严格模式禁用，性能/可读性差。', 'with (obj) {\n  a = 1; // 等于 obj.a = 1\n}'],
    ]
  },
  {
    id: 'iteration', icon: '🔁', title: '循环与迭代',
    items: [
      ['for', 'hot', 'C 风格循环：初始化; 条件; 后置。三段可省但分号不可。', 'for (let i=0; i<5; i++){\n  console.log(i);\n}'],
      ['for...of', 'hot', '遍历可迭代对象（Array/String/Map/Set）的元素值。不能用于普通对象。', 'for (const item of arr) {\n  console.log(item);\n}'],
      ['for...in', 'common', '遍历对象自身和继承的可枚举属性（键名）。不建议用于数组。', 'for (const k in obj) {\n  if (obj.hasOwnProperty(k)) console.log(k);\n}'],
      ['while', 'hot', '先判断后执行的循环。条件为 true 时反复执行。', 'let n = 0;\nwhile (n < 3) n++;'],
      ['do...while', 'common', '先执行后判断，至少执行一次。结尾分号不可省。', 'let i = 0;\ndo { i++; } while (i < 5);'],
      ['for await...of', 'rare', '异步遍历异步可迭代对象（异步生成器、流），逐个 await。', 'for await (const chunk of stream) {\n  console.log(chunk);\n}'],
      ['break', 'common', '跳出当前最内层循环或 switch；可配合 label 跳多层。', 'for (const v of arr) {\n  if (v === t) break;\n}'],
      ['continue', 'common', '跳过本次循环剩余语句，进入下一次迭代。可配 label。', 'for (let i=0;i<10;i++){\n  if (i%2) continue;\n  console.log(i);\n}'],
      ['label', 'rare', '为语句打标签，供 break/continue 引用，跳出多层循环。', 'outer:\nfor (let i=0;i<3;i++)\n  for (let j=0;j<3;j++)\n    if (i+j>3) break outer;'],
    ]
  },
  {
    id: 'function', icon: '⚡', title: '函数与异步',
    items: [
      ['function', 'hot', '声明函数。函数声明会被提升，可在声明前调用。', 'function add(a, b) {\n  return a + b;\n}'],
      ['return', 'hot', '终止函数并返回值。无表达式的 return 返回 undefined。', 'function f(x){ return x * 2; }'],
      ['箭头函数 =>', 'hot', 'ES6 简洁函数写法。无自己的 this/arguments/super/new.target；单表达式可省 return 和 {}。', 'const sq = x => x * x;\nconst add = (a, b) => a + b;\nconst log = () => console.log("hi");'],
      ['async function', 'hot', '声明异步函数，函数体内可用 await，返回值自动包成 Promise。', 'async function fetch(){\n  const r = await fetch(url);\n  return r.json();\n}'],
      ['await', 'hot', '暂停 async 函数等待 Promise 完成；fulfilled 取值，rejected 抛错（需 try/catch）。', 'async function load(){\n  const data = await api.get();\n  return data;\n}'],
      ['function*', 'rare', '声明生成器函数，返回 Generator，可多次 yield 暂停再恢复。', 'function* gen(){\n  yield 1;\n  yield 2;\n  yield 3;\n}'],
      ['yield', 'rare', '生成器中产出值并暂停；可接收 next() 传入参数。yield* 委托另一个可迭代对象。', 'function* g(){\n  const x = yield 1;\n  yield* [2, 3];\n}'],
      ['async function*', 'rare', '声明异步生成器，可 yield Promise，需用 for await...of 遍历。', 'async function* gen(){\n  yield await fetch("/a");\n}'],
    ]
  },
  {
    id: 'object', icon: '🧩', title: '对象与类',
    items: [
      ['class', 'common', '声明一个类，含 constructor、方法、字段。类不提升；可被 extends 继承。', 'class Animal {\n  constructor(name){ this.name = name; }\n  speak(){ return this.name; }\n}'],
      ['extends', 'common', '类继承父类（类或含 [[Construct]] 的函数）。子类构造函数中需调用 super。', 'class Dog extends Animal {\n  speak(){ return "woof"; }\n}'],
      ['super', 'common', '调用父类的构造函数或方法。子类 constructor 在使用 this 前必须先调 super(...)。', 'class Cat extends Animal {\n  constructor(){ super("cat"); }\n}'],
      ['new', 'hot', '以构造函数/类创建实例，执行 [[Construct]] 并把 this 绑到新对象。', 'const d = new Dog("Rex");'],
      ['this', 'common', '当前执行上下文对象。值随调用方式变化（方法/构造/箭头/bind/call/apply）。', 'const obj = {\n  name: "x",\n  get(){ return this.name; }\n};'],
      ['typeof', 'common', '运算符：返回操作数类型的字符串。null 返回 "object"（历史 bug）。', 'typeof "a";    // "string"\ntypeof null;   // "object"\ntypeof f;      // "function"'],
      ['instanceof', 'common', '检查对象原型链上是否存在构造函数的 prototype。', '[] instanceof Array;        // true\nnew Date() instanceof Date; // true'],
      ['delete', 'common', '删除对象自身属性。不可删除 var 声明变量；严格模式不可配置属性会抛错。', 'const o = {a:1};\ndelete o.a;\nconsole.log(o.a); // undefined'],
      ['in', 'common', '判断对象中是否存在某属性（含原型链）。', '"toString" in {};  // true\n"length" in [];    // true'],
    ]
  },
  {
    id: 'array', icon: '📋', title: 'Array 数组',
    items: [
      ['map', 'hot', '对每个元素调用回调，返回新数组。不改原数组。', 'const r = [1,2,3].map(x => x*2);\n// [2,4,6]'],
      ['filter', 'hot', '过滤出回调返回 truthy 的元素，返回新数组。', 'const r = [1,2,3,4].filter(x => x>2);\n// [3,4]'],
      ['reduce', 'hot', '从左到右累计：回调 (acc, cur, idx, arr)。初始值可选但建议传。', 'const sum = [1,2,3].reduce((a,b)=>a+b, 0);\n// 6'],
      ['forEach', 'hot', '遍历每个元素执行回调，无返回值（不能用 break）。', '[1,2,3].forEach((v,i) => {\n  console.log(i, v);\n});'],
      ['find', 'common', '返回第一个满足回调的元素，无则 undefined。', 'const u = users.find(u => u.id === 5);'],
      ['findIndex', 'common', '返回第一个满足回调的元素索引，无则 -1。', 'const i = arr.findIndex(x => x>10);'],
      ['some', 'common', '是否有元素满足回调（返回 boolean，遇到 true 即停）。', 'const has = arr.some(x => x > 0);'],
      ['every', 'common', '是否所有元素都满足回调（遇到 false 即停）。', 'const all = arr.every(x => x > 0);'],
      ['includes', 'hot', '判断数组是否包含某值（NaN 也能正确匹配）。', '[1,2,3].includes(2);   // true\n[NaN].includes(NaN);   // true'],
      ['indexOf', 'common', '返回某值首次出现的索引，无则 -1。不能识别 NaN。', '[1,2,3].indexOf(2);   // 1'],
      ['lastIndexOf', 'common', '从后向前找，返回某值最后出现的索引，无则 -1。', '[1,2,2,3].lastIndexOf(2); // 2'],
      ['slice', 'common', '返回 [start, end) 的浅拷贝片段，不改原数组。', 'const r = [1,2,3,4].slice(1,3);\n// [2,3]'],
      ['splice', 'common', '在指定位置删除/插入元素，会修改原数组，返回被删元素。', 'const a = [1,2,3];\na.splice(1, 1, "x");\n// a = [1,"x",3]'],

/* ============================
 *  渲染
 * ============================ */
const contentEl = document.getElementById('content');
const sectionsEl = document.getElementById('sections');
const navListEl = document.getElementById('navList');
const searchInput = document.getElementById('search');
const searchCountEl = document.getElementById('searchCount');
const clearBtn = document.getElementById('clearBtn');
const emptyTip = document.getElementById('emptyTip');
const statsEl = document.getElementById('stats');

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlightCode(code){
  let s = escapeHtml(code);
  s = s.replace(/(\/\/[^\n]*)/g, '<span class="com">$1</span>');
  s = s.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="str">$1</span>');
  s = s.replace(/("[^"\n]*"|'[^'\n]*'|`[^`\n]*`)/g, '<span class="str">$1</span>');
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');
  const kw = ['var','let','const','function','return','if','else','for','while','do','switch','case','break','continue','new','class','extends','super','this','try','catch','finally','throw','import','export','default','from','as','async','await','yield','in','of','instanceof','delete','typeof','void','debugger','use strict'];
  s = s.replace(new RegExp('\\b(' + kw.join('|') + ')\\b','g'), '<span class="kw">$1</span>');
  return s;
}
function tagLabel(tag){
  switch(tag){
    case 'hot': return ['常用','hot'];
    case 'common': return ['普通','common'];
    case 'rare': return ['少见','rare'];
    case 'deprecated': return ['废弃','deprecated'];
    default: return ['普通','common'];
  }
}

function render(){
  let navHtml = '';
  let sectionsHtml = '';
  let totalItems = 0;

  DATA.forEach((cat, ci) => {
    const cnt = cat.items.length;
    totalItems += cnt;
    navHtml += `<a href="#${cat.id}" data-target="${cat.id}" class="${ci===0?'active':''}">
      <span class="ico">${cat.icon}</span>
      <span>${cat.title}</span>
      <span class="cnt">${cnt}</span>
    </a>`;
    sectionsHtml += `<section class="category" id="${cat.id}">
      <h2><span class="ico">${cat.icon}</span>${cat.title} <span class="badge">${cnt} 条</span></h2>
      <div class="grid">`;
    cat.items.forEach(item => {
      const [name, tag, desc, code] = item;
      const [lbl, cls] = tagLabel(tag);
      sectionsHtml += `<article class="card" data-search="${escapeHtml((name+' '+desc).toLowerCase())}">
        <div class="card-head">
          <span class="name">${escapeHtml(name)}</span>
          <span class="tag ${cls}">${lbl}</span>
        </div>
        <p class="card-desc">${escapeHtml(desc)}</p>
        <pre class="code"><code>${highlightCode(code)}</code></pre>
      </article>`;
    });
    sectionsHtml += `</div></section>`;
  });

  navListEl.innerHTML = navHtml;
  sectionsEl.innerHTML = sectionsHtml;

  statsEl.innerHTML = `<span>📚 <b>${DATA.length}</b> 大类</span>
    <span>🗂️ <b>${totalItems}</b> 条目</span>
    <span>⭐ 标签：常用 / 普通 / 少见 / 废弃</span>`;
}

/* ============================
 *  侧栏交互
 * ============================ */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebarOverlay');
const toggleBtn = document.getElementById('sidebarToggle');

function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
toggleBtn.addEventListener('click', openSidebar);
overlay.addEventListener('click', closeSidebar);

navListEl.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-target]');
  if(!a) return;
  if(window.innerWidth <= 860) closeSidebar();
});

function navLinks(){ return navListEl.querySelectorAll('a[data-target]'); }
function sectionEls(){ return sectionsEl.querySelectorAll('section.category'); }

function onScroll(){
  if(window.innerWidth <= 860) return;
  const top = window.scrollY + 80;
  let current = null;
  sectionEls().forEach(sec => {
    if(sec.offsetTop <= top) current = sec.id;
  });
  navLinks().forEach(a => {
    a.classList.toggle('active', a.dataset.target === current);
  });
}
window.addEventListener('scroll', onScroll, { passive: true });

/* ============================
 *  搜索
 * ============================ */
function doSearch(){
  const q = searchInput.value.trim().toLowerCase();
  const cards = sectionsEl.querySelectorAll('.card');
  let visible = 0;
  cards.forEach(card => {
    const hay = card.dataset.search || '';
    const match = !q || hay.indexOf(q) !== -1;
    card.classList.toggle('hidden', !match);
    if(match) visible++;
  });
  sectionEls().forEach(sec => {
    const anyVisible = sec.querySelectorAll('.card:not(.hidden)').length > 0;
    sec.classList.toggle('hidden', !anyVisible && !!q);
  });
  emptyTip.classList.toggle('show', !!q && visible === 0);
  searchCountEl.textContent = q ? `${visible} / ${cards.length} 项` : '';
  clearBtn.style.display = q ? 'inline-block' : 'none';
}
searchInput.addEventListener('input', doSearch);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  doSearch();
  searchInput.focus();
});

/* ============================
 *  快捷键 "/" 聚焦搜索
 * ============================ */
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.value = '';
    doSearch();
    searchInput.blur();
  }
});

/* ============================
 *  初始化
 * ============================ */
render();
onScroll();
</script>
</body>
</html>
